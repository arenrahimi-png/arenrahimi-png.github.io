<script>
/* =========================================================
   MUHAMMET AREN RAHIMI
   FOTOĞRAF SİSTEMİ — SON VE GÜVENLİ SÜRÜM
   ========================================================= */

(function () {

    const API =
        "https://api.github.com/repos/arenrahimi-png/arenrahimi.github.io/contents/";

    const RAW =
        "https://raw.githubusercontent.com/arenrahimi-png/arenrahimi.github.io/main/";

    /*
     * Repo'da gerçekten bulunan ve daha önce doğrulanan dosyalar.
     * Kırık eski isimler kullanılmıyor.
     */
    const KNOWN = {

        hero:
            "file_0000000092a08210b4c6b75ce2a7b391.png",

        about:
            "file_00000000960c821198226d89d0b6c1d3.png",

        bm:
            "file_00000000adf08210b1264a49b8d4ad1a.png",

        tech:
            "file_0000000036408210b363b9cc728518c3.png",

        /*
         * GitHub reposunda gerçekten görünen AB iklim fotoğrafı.
         */
        euClimate:
            "AB_iklim_orijinal_yuz_dokunulmadan.jpg",

        /*
         * GitHub'da daha önce görülen Avrupa Günü fotoğrafı.
         */
        euDay:
            "file_0000000014a481f698a3ce9941d3a4fb.png"

    };


    /*
     * Türkiye ve Ulusal Ajans fotoğraflarının
     * GitHub ekranında görünen benzersiz başlangıçları.
     *
     * Tam dosya adı bilinmediğinde API gerçek adı bulacak.
     */
    const PREFIXES = {

        turkey: [
            "file_0000000f8d88210a51ff732"
        ],

        agency: [
            "file_0000000f42c81f5ac647e3"
        ],

        eu: [
            "file_0000000014a481f698a3ce99"
        ],

        tech: [
            "file_0000000036408210b363b9cc"
        ]

    };


    /* -------------------------------------------------------
       Dosya adını küçük harfe çevir
       ------------------------------------------------------- */

    function nameOf(path) {

        return path
            .split("/")
            .pop()
            .toLowerCase();

    }


    /* -------------------------------------------------------
       Bir dosyayı güvenli şekilde bul
       ------------------------------------------------------- */

    function findExact(files, wanted) {

        const target = wanted.toLowerCase();

        return files.find(function (file) {

            return nameOf(file) === target;

        });

    }


    /* -------------------------------------------------------
       Prefix ile gerçek dosyayı bul
       ------------------------------------------------------- */

    function findPrefix(files, prefixes) {

        for (const prefix of prefixes) {

            const p = prefix.toLowerCase();

            const found = files.find(function (file) {

                return nameOf(file).startsWith(p);

            });

            if (found) return found;

        }

        return null;

    }


    /* -------------------------------------------------------
       RAW GitHub URL
       ------------------------------------------------------- */

    function raw(file) {

        return RAW +
            file
                .split("/")
                .map(function (part) {

                    return encodeURIComponent(part);

                })
                .join("/");

    }


    /* -------------------------------------------------------
       Fotoğrafı sayfaya yerleştir
       ------------------------------------------------------- */

    function put(type, file) {

        if (!file) {

            console.warn(
                "Fotoğraf bulunamadı:",
                type
            );

            return;

        }

        const url = raw(file);

        const elements =
            document.querySelectorAll(
                '[data-image="' + type + '"]'
            );

        elements.forEach(function (img) {

            /*
             * Cache problemi yaşamamak için
             * GitHub URL'sine küçük bir sürüm parametresi.
             */
            const finalURL =
                url + "?v=20260915";

            img.removeAttribute("srcset");

            img.src = finalURL;

            img.loading = "lazy";

            img.decoding = "async";

            /*
             * Görsel yüklenmezse tekrar doğrudan
             * raw GitHub adresini dene.
             */
            img.onerror = function () {

                if (img.dataset.retry !== "1") {

                    img.dataset.retry = "1";

                    img.src = url;

                }

            };

        });

        console.log(
            "✓ Fotoğraf:",
            type,
            "→",
            file
        );

    }


    /* -------------------------------------------------------
       ANA SİSTEM
       ------------------------------------------------------- */

    async function loadPhotos() {

        try {

            const response =
                await fetch(
                    API + "?v=20260915",
                    {
                        cache: "no-store",
                        headers: {
                            "Accept":
                                "application/vnd.github+json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "GitHub API yanıt vermedi."
                );

            }


            const data =
                await response.json();


            /*
             * Sadece gerçek görseller.
             */
            const files =
                data
                    .filter(function (item) {

                        return (
                            item.type === "file" &&
                            /\.(png|jpg|jpeg|webp)$/i
                                .test(item.name)
                        );

                    })
                    .map(function (item) {

                        return item.name;

                    });


            console.log(
                "GitHub'daki gerçek görseller:",
                files
            );


            /* =================================================
               1 — HERO
               ================================================= */

            const hero =
                findExact(
                    files,
                    KNOWN.hero
                );

            put(
                "hero",
                hero
            );


            /* =================================================
               2 — HAKKIMDA
               ================================================= */

            const about =
                findExact(
                    files,
                    KNOWN.about
                );

            put(
                "about",
                about
            );


            /* =================================================
               3 — TÜRKİYE
               ================================================= */

            const turkey =
                findPrefix(
                    files,
                    PREFIXES.turkey
                );

            put(
                "turkey",
                turkey
            );


            /* =================================================
               4 — TÜRKİYE ULUSAL AJANSI
               ================================================= */

            const agency =
                findPrefix(
                    files,
                    PREFIXES.agency
                );

            put(
                "agency",
                agency
            );


            /* =================================================
               5 — BİRLEŞMİŞ MİLLETLER
               ================================================= */

            const bm =
                findExact(
                    files,
                    KNOWN.bm
                );

            put(
                "bm",
                bm
            );


            /* =================================================
               6 — AVRUPA BİRLİĞİ
               ================================================= */

            let eu =
                findExact(
                    files,
                    KNOWN.euClimate
                );


            /*
             * AB iklim fotoğrafı yoksa
             * Avrupa Günü fotoğrafını kullan.
             */
            if (!eu) {

                eu =
                    findPrefix(
                        files,
                        PREFIXES.eu
                    );

            }


            if (!eu) {

                eu =
                    findExact(
                        files,
                        KNOWN.euDay
                    );

            }


            put(
                "eu",
                eu
            );


            /* =================================================
               7 — TEKNOLOJİ & YAPAY ZEKÂ
               ================================================= */

            const tech =
                findExact(
                    files,
                    KNOWN.tech
                ) ||
                findPrefix(
                    files,
                    PREFIXES.tech
                );


            put(
                "tech",
                tech
            );


            /* =================================================
               SON KONTROL
               ================================================= */

            console.table({

                "Türkiye":
                    turkey || "❌ BULUNAMADI",

                "Türkiye Ulusal Ajansı":
                    agency || "❌ BULUNAMADI",

                "Birleşmiş Milletler":
                    bm || "❌ BULUNAMADI",

                "Avrupa Birliği":
                    eu || "❌ BULUNAMADI",

                "Teknoloji":
                    tech || "❌ BULUNAMADI"

            });


        } catch (error) {

            console.error(
                "GitHub fotoğraf sistemi:",
                error
            );


            /*
             * API herhangi bir nedenle çalışmazsa,
             * kesin bildiğimiz dosyaları yine doğrudan yükle.
             */

            put(
                "hero",
                KNOWN.hero
            );

            put(
                "about",
                KNOWN.about
            );

            put(
                "bm",
                KNOWN.bm
            );

            put(
                "tech",
                KNOWN.tech
            );

            put(
                "eu",
                KNOWN.euClimate
            );

        }

    }


    /* -------------------------------------------------------
       SAYFA HAZIR
       ------------------------------------------------------- */

    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            loadPhotos
        );

    } else {

        loadPhotos();

    }

})();
</script>
