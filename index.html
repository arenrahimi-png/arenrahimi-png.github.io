<script>
/* ============================================================
   MUHAMMET AREN RAHIMI
   GITHUB FOTOĞRAF SİSTEMİ — SON SÜRÜM

   Mevcut tasarıma dokunmaz.
   Fotoğrafları GitHub repository'den gerçek dosya URL'leriyle yükler.
   ============================================================ */

const GITHUB_TREE =
"https://api.github.com/repos/arenrahimi-png/arenrahimi.github.io/git/trees/main?recursive=1";

const GITHUB_RAW =
"https://raw.githubusercontent.com/arenrahimi-png/arenrahimi.github.io/main/";


/* ------------------------------------------------------------
   GitHub'daki GERÇEK görsel dosyalarını getir
   ------------------------------------------------------------ */

async function getRepositoryImages(){

    const response = await fetch(GITHUB_TREE,{
        headers:{
            "Accept":"application/vnd.github+json"
        },
        cache:"no-store"
    });

    if(!response.ok){
        throw new Error("GitHub dosya listesi alınamadı.");
    }

    const data = await response.json();

    return (data.tree || [])
        .filter(file =>
            file.type === "blob" &&
            /\.(png|jpg|jpeg|webp)$/i.test(file.path)
        )
        .map(file => file.path);

}


/* ------------------------------------------------------------
   Dosya adını normalize et
   ------------------------------------------------------------ */

function cleanName(path){

    return path
        .split("/")
        .pop()
        .toLowerCase()
        .replace(/\.(png|jpg|jpeg|webp)$/i,"");

}


/* ------------------------------------------------------------
   GERÇEK DOSYA ADLARI

   Bunlar GitHub repository'de gerçekten görülen dosyalardır.
   ------------------------------------------------------------ */

const KNOWN = {

    hero:
    "file_0000000092a08210b4c6b75ce2a7b391.png",

    about:
    "file_00000000960c821198226d89d0b6c1d3.png",

    bm:
    "file_00000000adf08210b1264a49b8d4ad1a.png",

    tech:
    "file_0000000036408210b363b9cc728518c3.png",

    climate:
    "AB_iklim_orijinal_yuz_dokunulmadan.jpg"

};


/* ------------------------------------------------------------
   Fotoğrafın gerçek GitHub URL'si
   ------------------------------------------------------------ */

function rawURL(file){

    return GITHUB_RAW +
        file
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

}


/* ------------------------------------------------------------
   Belirli bir fotoğrafı sayfadaki alanlara bağla
   ------------------------------------------------------------ */

function connectImage(type,file){

    if(!file) return;

    const url = rawURL(file);

    document
        .querySelectorAll('[data-image="' + type + '"]')
        .forEach(img => {

            img.src = url;

            img.removeAttribute("srcset");

            img.loading = "lazy";

            img.decoding = "async";

        });

}


/* ------------------------------------------------------------
   EXACT dosya kontrolü
   ------------------------------------------------------------ */

function exactFile(files,name){

    return files.find(file =>
        cleanName(file) ===
        cleanName(name)
    );

}


/* ------------------------------------------------------------
   FOTOĞRAFLARI YÜKLE
   ------------------------------------------------------------ */

async function loadPhotos(){

    try{

        const files =
            await getRepositoryImages();


        console.log(
            "GitHub'da bulunan gerçek görseller:",
            files
        );


        /* =====================================================
           KESİN OLARAK BİLDİĞİMİZ FOTOĞRAFLAR
           ===================================================== */

        const hero =
            exactFile(
                files,
                KNOWN.hero
            );

        const about =
            exactFile(
                files,
                KNOWN.about
            );

        const bm =
            exactFile(
                files,
                KNOWN.bm
            );

        const tech =
            exactFile(
                files,
                KNOWN.tech
            );

        const climate =
            exactFile(
                files,
                KNOWN.climate
            );


        connectImage("hero",hero);
        connectImage("about",about);
        connectImage("bm",bm);
        connectImage("tech",tech);


        /* =====================================================
           TÜRKİYE / ULUSAL AJANS / AB

           Burada eski yanlış dosya adlarını kullanmıyoruz.

           GitHub'daki dosyaların tamamını alıp,
           daha önce mevcut sayfada kullanılan yanlış adları
           tekrar denemek yerine gerçek dosyaları tespit ediyoruz.
           ===================================================== */


        const unused =
            files.filter(file => {

                const n =
                    cleanName(file);

                return (
                    n.startsWith("file_") &&
                    n !== cleanName(KNOWN.hero) &&
                    n !== cleanName(KNOWN.about) &&
                    n !== cleanName(KNOWN.bm) &&
                    n !== cleanName(KNOWN.tech)
                );

            });


        console.log(
            "Diğer gerçek görseller:",
            unused
        );


        /*
         * Dosya listesinden geriye kalan görselleri
         * doğrudan data-image alanlarına sırayla bağlamıyoruz.
         *
         * Çünkü fotoğrafın yanlış bölüme gitmesini istemiyoruz.
         *
         * Önce görsellerin gerçek dosya adlarını doğruluyoruz.
         */


        /* =====================================================
           AB İKLİM FOTOĞRAFI

           Repo'da gerçek adı görülen dosya.
           Eğer AB bölümü için kullanılacaksa bağlanır.
           ===================================================== */

        if(climate){

            connectImage(
                "eu",
                climate
            );

        }


        /* =====================================================
           HATA KONTROLÜ
           ===================================================== */

        const result = {

            hero: hero || "BULUNAMADI",

            about: about || "BULUNAMADI",

            turkey:
                document.querySelector(
                    '[data-image="turkey"]'
                )?.src || "BEKLENİYOR",

            agency:
                document.querySelector(
                    '[data-image="agency"]'
                )?.src || "BEKLENİYOR",

            bm: bm || "BULUNAMADI",

            eu:
                climate || "BEKLENİYOR",

            tech: tech || "BULUNAMADI"

        };


        console.table(result);


    }catch(error){

        console.error(
            "Fotoğraf sistemi hatası:",
            error
        );

    }

}


/* ------------------------------------------------------------
   SAYFA HAZIR
   ------------------------------------------------------------ */

if(
    document.readyState === "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        loadPhotos
    );

}else{

    loadPhotos();

}

</script>
