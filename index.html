*{
    box-sizing:border-box;

    padding:0;
}

html{
    scroll-behavior:smooth;

body{

    background:#f5f1e9;
    color:#171717;
    line-height:1.6;
}

nav{
    width:100%;
    padding:26px 7%;
    display:flex;
    justify-content:space-between;

    background:#f5f1e9;

    top:0;
    z-index:10;
}

.logo{
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
}

nav a{
    color:#222;
    text-decoration:none;
    margin-left:28px;
    font-size:14px;
}

nav a:hover{
    opacity:.55;

.hero{
    min-height:88vh;

    display:flex;

    justify-content:space-between;
    gap:60px;
}

.hero-text{
    max-width:620px;
}

.kicker{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#777;
    margin-bottom:20px;
}

h1{
    font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(52px,7vw,92px);

}

.hero h2{
    font-size:22px;
    font-weight:500;
    margin-bottom:20px;
}

.hero p{
    font-size:18px;
    color:#555;
    max-width:560px;
}

.hero-image{
    width:min(470px,45vw);
    height:580px;
    object-fit:cover;
    border-radius:3px;
    box-shadow:0 20px 50px rgba(0,0,0,.12);
}

.button{
    display:inline-block;
    margin-top:32px;
    padding:14px 25px;
    background:#d9b44a;
    color:#111;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

section{
    padding:100px 7%;
    border-top:1px solid #ddd6ca;
}

.section-title{
    font-family:Georgia, "Times New Roman", serif;
    font-size:46px;
    font-weight:500;
    margin-bottom:35px;
}

.about{
    max-width:850px;
    font-size:20px;
    color:#444;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
}
